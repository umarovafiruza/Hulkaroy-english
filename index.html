<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Speak Fast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Home Screen -->
  <main class="home" id="home">
    <div class="brand">Speak Fast</div>
    <h1>Ovoz chiqarib o'qing. Ravon gapirishni o'rganing.</h1>
    <p class="lead">Mavzuni tanlang. Matn o'zi sekin yuqoriga suriladi, siz esa uni ovoz chiqarib o'qiysiz.</p>
    <div class="stats" id="stats"></div>
    <div class="level-tabs" id="levelTabs">
      <button class="level-btn active" data-lvl="all" type="button">Barchasi</button>
      <button class="level-btn" data-lvl="A1" type="button">A1 Oson</button>
      <button class="level-btn" data-lvl="A2" type="button">A2 O'rta</button>
      <button class="level-btn" data-lvl="B1" type="button">B1 Murakkab</button>
    </div>
    <div class="list" id="list"></div>

    <!-- Recordings Section on Home Screen -->
    <section class="recordings-section" id="recsSection">
      <div class="recs-header">
        <span class="recs-title">Ovozli yozuvlar (Diktafon)</span>
        <span class="recs-count" id="recsCount">0 / 3</span>
      </div>
      <div class="recs-list" id="recsList"></div>
    </section>
  </main>

  <!-- Reader Screen -->
  <section class="reader hidden" id="reader" aria-live="polite">
    <div class="top">
      <button class="back" id="back">Mavzular</button>
      <div class="ttl" id="rtitle">
        <span id="rtitleText"></span>
        <span class="lvl-badge" id="rlvl"></span>
      </div>
      <div class="rec-badge" id="recBadge">
        <span class="rec-dot" id="recDot"></span>
        <span id="recText">Yozuv: Tayyor</span>
      </div>
    </div>
    
    <div class="bar"><i id="prog"></i></div>
    
    <div class="stage" id="stage">
      <div class="content" id="content">
        <div class="text" id="text"></div>
      </div>
    </div>
    
    <div class="overlay hidden" id="overlay"></div>

    <!-- Word Bottom Sheet -->
    <div class="sheet hidden" id="sheet">
      <div>
        <div class="w" id="sw"></div>
        <div class="u" id="su"></div>
      </div>
      <div class="acts">
        <button class="btn ghost" id="sListen">Eshitish</button>
        <button class="btn" id="sGo">Davom etish</button>
      </div>
    </div>

    <!-- Finish Screen -->
    <div class="finish hidden" id="finish">
      <h2>Barakalla</h2>
      <p id="fmsg"></p>
      
      <!-- Last Recording Player -->
      <div class="finish-rec hidden" id="finishRec">
        <div class="finish-rec-title">Sizning ovozli yozuvingiz (Diktafon):</div>
        <div class="rec-card-top">
          <span class="rec-card-title" id="finishRecTitle"></span>
          <span class="rec-card-meta" id="finishRecMeta"></span>
        </div>
        <div class="rec-card-bottom" style="margin-top: 10px;">
          <button class="btn-rec-play" id="finishPlayBtn" type="button">Eshitish</button>
          <div class="rec-bar" id="finishRecBar" role="slider" aria-label="Audio progress">
            <div class="rec-bar-fill" id="finishRecFill"></div>
          </div>
          <span class="rec-time" id="finishRecTime">00:00</span>
        </div>
      </div>

      <div class="row">
        <button class="btn" id="again">Qayta o'qish</button>
        <button class="btn ghost" id="toList">Mavzular</button>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
      <div class="btn-group">
        <button class="btn" id="pause">Pauza</button>
        <button class="btn ghost" id="restart">Boshidan</button>
        <button class="btn ghost" id="recToggle" type="button">Yozuv: Yoqiq</button>
      </div>
      <div class="speed-panel">
        <div class="presets" id="presets">
          <button class="preset-btn" data-wpm="80" type="button">Sekin</button>
          <button class="preset-btn" data-wpm="110" type="button">O'rtacha</button>
          <button class="preset-btn" data-wpm="150" type="button">Tez</button>
          <button class="preset-btn" data-wpm="200" type="button">Tezkor</button>
        </div>
        <div class="speed-slider-row">
          <span class="speed-label">Tezlik</span>
          <button class="btn-step" id="speedDown" type="button" aria-label="Tezlikni kamaytirish">−</button>
          <input type="range" id="speed" min="60" max="260" step="5" value="110">
          <button class="btn-step" id="speedUp" type="button" aria-label="Tezlikni oshirish">+</button>
          <b id="speedVal">110 so'z/daq</b>
        </div>
      </div>
      <div class="music-panel" id="musicPanel">
        <div class="music-header-row">
          <button class="btn-music-toggle" id="musicToggle" type="button">Kuy: O'chiq</button>
          <div class="track-nav">
            <button class="btn-step" id="musicPrev" type="button" aria-label="Oldingi kuy">‹</button>
            <span class="track-name" id="trackName">Cold Brew</span>
            <button class="btn-step" id="musicNext" type="button" aria-label="Keyingi kuy">›</button>
          </div>
        </div>
        <div class="track-chips" id="trackChips">
          <button class="chip active" data-track="0" type="button">Cold Brew</button>
          <button class="chip" data-track="1" type="button">Kyoto</button>
          <button class="chip" data-track="2" type="button">Moonshine</button>
          <button class="chip" data-track="3" type="button">Sunday</button>
        </div>
        <div class="music-slider-row">
          <span class="music-label">Ovoz</span>
          <button class="btn-step" id="musicVolDown" type="button" aria-label="Ovozni pasaytirish">−</button>
          <input type="range" id="musicVol" min="0" max="100" step="5" value="30">
          <button class="btn-step" id="musicVolUp" type="button" aria-label="Ovozni ko'tarish">+</button>
          <b id="musicVolVal">30%</b>
        </div>
      </div>
    </div>
  </section>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
